{% extends "base.html" %} {% block title %}Touhid Blog{% endblock title %} 

{% load static %}

{% block styles %}

<link rel="stylesheet" href="{% static 'blog/post-detail.css' %}">


{% endblock styles %} 


{% block body %}
   <section id="summary">
    <h2>{{post.title}}</h2>
    <article>
        <img src="{% static "blog/images/"|add:post.image %}" alt="{{post.title}}" srcset="">
        <address>By {{post.author}}</address>
        <div>
            Last updated on <time>{{post.date|date:"d M Y"}}</time>
        </div>
    </article>
   </section>
   <main>
    <p>
    {{post.content|linebreaks}}
    </p>
   </main>

{% endblock body %}
